version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      renderer:
        patterns: ['react', 'react-dom', '@types/react*', 'vite', '@vitejs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
