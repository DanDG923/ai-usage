name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The collectors and the SQLite store are exercised by the tests on any
    # platform; the packaged Windows build is a separate, release-time step.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
