name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The collectors and the SQLite store are exercised by the tests on any
    # platform; the packaged Windows build is a separate, release-time step.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  package:
    # Packages the unsigned Windows build and audits the ASAR and private
    # update feed, so packaging regressions surface on every push rather than
    # at release time. The nsis target is required: electron-builder only
    # writes resources/app-update.yml for an updater-aware target, so a plain
    # --dir build has no feed to audit. The portable target is skipped, which
    # is why the audit runs in --unpacked mode. No publishing token is present.
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run build:web
      # build.releaseInfo.releaseNotesFile must exist even with --publish never.
      - run: npm run release:notes
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node tools/audit-release.cjs --unpacked
