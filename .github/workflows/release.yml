name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, for example v1.0.28'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Everything that installs dependencies or runs project code happens here,
  # under a token that can only read the repository. Whatever a dependency
  # does in this job, it cannot create, change or delete a release or a tag.
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Runs before anything is installed, so nothing from a tag that is not
      # on main is ever executed. The token it uses is read-only.
      - name: Validate version and destination
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$($package.version)") {
            throw 'The version tag must match package.json exactly.'
          }
          if ($env:GITHUB_REPOSITORY -cne 'DanDG923/ai-usage' -or $package.build.publish.owner -cne 'DanDG923' -or $package.build.publish.repo -cne 'ai-usage' -or $package.build.publish.private -ne $false) {
            throw 'This workflow only publishes the configured public AI Usage repository.'
          }
          # Only reviewed, merged work may enter the update feed: the tagged
          # commit has to be an ancestor of main, not a side branch.
          $head = (git rev-parse 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the tagged commit.' }
          $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$head" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $comparison.status -notin @('identical', 'behind')) {
            throw 'The release tag must point at a commit that is already on main.'
          }
          "commit=$head" >> $env:GITHUB_OUTPUT
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run version:check
      - run: npm run test:electron
      # build runs tests, renderer compilation, Windows packaging with
      # --publish never, and the ASAR / manifest / checksum audit. No step
      # after the validation above is given a token, and this job's token
      # can only read the repository in any case.
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            release/AI-Usage-Setup-*-x64.exe
            release/AI-Usage-Setup-*-x64.exe.blockmap
            release/AI-Usage-Portable-*-x64.exe
            release/latest.yml
            release/SHA256SUMS.txt
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # The only job allowed to write releases. It starts on a fresh runner,
  # checks out package.json and nothing else, installs nothing and runs no
  # project code: it validates, then hands the built files to `gh release`.
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          sparse-checkout: /package.json
          sparse-checkout-cone-mode: false
      # The same checks as in the build job, repeated where the write
      # permission is, against this job's own checkout of the tag.
      - name: Validate version and destination
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -cne "v$($package.version)") {
            throw 'The version tag must match package.json exactly.'
          }
          if ($env:GITHUB_REPOSITORY -cne 'DanDG923/ai-usage' -or $package.build.publish.owner -cne 'DanDG923' -or $package.build.publish.repo -cne 'ai-usage' -or $package.build.publish.private -ne $false) {
            throw 'This workflow only publishes the configured public AI Usage repository.'
          }
          # Only reviewed, merged work may enter the update feed: the tagged
          # commit has to be an ancestor of main, not a side branch.
          $head = (git rev-parse 'HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the tagged commit.' }
          $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$head" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $comparison.status -notin @('identical', 'behind')) {
            throw 'The release tag must point at a commit that is already on main.'
          }
          "commit=$head" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Publish audited release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
          VALIDATED_COMMIT: ${{ steps.validate.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'DanDG923/ai-usage'
          # The two jobs check the tag out separately. Publish only when it
          # still names the commit the build job packaged.
          if ($env:BUILT_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or $env:BUILT_COMMIT -cne $env:VALIDATED_COMMIT) {
            throw 'The release tag no longer points at the commit that was built; nothing has been published.'
          }
          $repository = gh api "repos/$repo" | ConvertFrom-Json
          # Installed copies read the feed anonymously, so a release published
          # while the repository is private could never be found by them.
          if ($LASTEXITCODE -ne 0 -or $repository.private -ne $false) {
            throw 'Release publication requires the destination repository to be public.'
          }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $releases = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify existing releases.' }
          foreach ($existing in $releases) {
            if ($existing.tag_name -ceq $env:RELEASE_TAG) {
              throw 'A release for this tag already exists. Review it before retrying; released assets are never overwritten.'
            }
            if (-not $existing.draft -and -not $existing.prerelease -and $existing.tag_name -cmatch '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -ge [version]$version) {
              throw 'A current or newer stable release already exists; refusing to move the update feed backwards.'
            }
          }
          $assetNames = @(
            "AI-Usage-Setup-$version-x64.exe",
            "AI-Usage-Setup-$version-x64.exe.blockmap",
            "AI-Usage-Portable-$version-x64.exe",
            'latest.yml',
            'SHA256SUMS.txt'
          )
          # The build job's output is data: it is never run here. Accept exactly
          # the expected files, and only if they still match the checksums the
          # release audit recorded for them.
          $expectedFiles = $assetNames + 'release-notes.md'
          $downloaded = @(Get-ChildItem -LiteralPath 'release' -Force -Recurse)
          if ($downloaded.Count -ne $expectedFiles.Count -or @($downloaded | Where-Object { $_.PSIsContainer -or $_.Name -cnotin $expectedFiles }).Count -ne 0) {
            throw 'The build artifact does not hold exactly the expected release files; nothing has been published.'
          }
          $checksummed = @($assetNames | Where-Object { $_ -cne 'SHA256SUMS.txt' })
          $checksumLines = @(Get-Content -LiteralPath (Join-Path 'release' 'SHA256SUMS.txt'))
          if ($checksumLines.Count -ne $checksummed.Count) {
            throw 'SHA256SUMS.txt does not list exactly the release files; nothing has been published.'
          }
          foreach ($name in $checksummed) {
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release' $name) -Algorithm SHA256).Hash.ToUpperInvariant()
            if (@($checksumLines | Where-Object { $_ -ceq "$actual *$name" }).Count -ne 1) {
              throw "Downloaded file does not match SHA256SUMS.txt: $name. Nothing has been published."
            }
          }
          $assets = $assetNames | ForEach-Object { Join-Path 'release' $_ }
          $notesPath = Join-Path 'release' 'release-notes.md'
          gh release create $env:RELEASE_TAG @assets --repo $repo --verify-tag --draft --title "AI Usage $version" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation or upload failed.' }
          # The by-tag REST endpoint only returns published releases. A writer
          # can see this new draft through the release-list endpoint.
          $afterUpload = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the uploaded draft release.' }
          $matchingDrafts = @($afterUpload | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG -and $_.draft })
          if ($matchingDrafts.Count -ne 1 -or $matchingDrafts[0].assets.Count -ne $assetNames.Count) {
            throw 'The draft release is incomplete; it has not been published.'
          }
          $uploaded = $matchingDrafts[0]
          foreach ($name in $assetNames) {
            $local = Get-Item -LiteralPath (Join-Path 'release' $name)
            $remote = @($uploaded.assets | Where-Object { $_.name -ceq $name })
            $sha256 = (Get-FileHash -LiteralPath $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remote.Count -ne 1 -or $remote[0].size -ne $local.Length -or $remote[0].digest -cne "sha256:$sha256") {
              throw "Uploaded asset verification failed: $name. The release remains a draft."
            }
          }
          gh release edit $env:RELEASE_TAG --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'The verified draft could not be published.' }
          $published = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.tag_name -cne $env:RELEASE_TAG -or $published.draft) {
            throw 'Unable to verify that the update feed points at the published release.'
          }
